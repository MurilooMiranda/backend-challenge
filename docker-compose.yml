name: wagering

x-app-environment: &app-environment
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ENDPOINT: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
  SQS_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
  WORKERS_ENABLED: 'true'
  RUN_MIGRATIONS: 'false'
  LOG_LEVEL: info
  AUTH_ENABLED: 'true'
  AUTH_ISSUER: http://localhost:8080/realms/wagering
  AUTH_AUDIENCE: wagering-api
  AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  OTEL_ENABLED: 'true'
  OTEL_SERVICE_NAME: wagering-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-app: &app
  build: .
  image: wagering-app:local
  profiles: ['app']
  environment: *app-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD',
        'bun',
        '-e',
        "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 12
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'status=$$(curl -sf http://localhost:4566/_localstack/init/ready) && echo "$$status" | grep -q ''"completed": true'' && ! echo "$$status" | grep -q ''"ERROR"''',
        ]
      interval: 2s
      timeout: 3s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ['app', 'auth']
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    image: wagering-app:local
    profiles: ['app']
    environment: *app-environment
    command: ['bun', 'src/infrastructure/persistence/migrate.ts', 'up']
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    ports:
      - '3001:3000'

  app-2:
    <<: *app
    ports:
      - '3002:3000'

  app-3:
    <<: *app
    ports:
      - '3003:3000'

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    profiles: ['observability']
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ['observability']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ['observability']
    depends_on:
      - prometheus
      - jaeger
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wagering.json
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3100:3000'

volumes:
  pgdata:
